# NOVA Audio API with Postgres bundled inside the Docker web service.
services:
  - type: web
    name: nova-audio-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "4000"
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: postgres
      - key: POSTGRES_DB
        value: nova_audio
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@127.0.0.1:5432/nova_audio
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false